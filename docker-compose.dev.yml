services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arena
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arena_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - arena-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "arena", "-d", "arena"]
      interval: 3s
      timeout: 3s
      retries: 12

volumes:
  arena-dev-db:
